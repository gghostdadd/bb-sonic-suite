<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BB DECK v1.0</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #000000;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

#crt {
  position: relative;
  background: #0c0a02;
  border: 1px solid #333333;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  width: min-content;
}

#crt::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, 0.06) 2px,
    rgba(0, 0, 0, 0.06) 4px
  );
  pointer-events: none;
  z-index: 10;
}

#display {
  font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
  font-size: 15px;
  line-height: 1.45;
  color: #FFFFFF;
  white-space: pre;
  overflow: hidden;
  padding: 0;
  min-width: 300px;
  text-shadow: 0 0 4px rgba(255,255,255,0.15);
  animation: flicker 6s infinite;
  user-select: none;
  -webkit-user-select: none;
}

.frame-line {
  font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
  font-size: 15px;
  line-height: 1.45;
  color: #FFFFFF;
  white-space: pre;
  overflow: hidden;
  text-shadow: 0 0 4px rgba(255,255,255,0.15);
  user-select: none;
  -webkit-user-select: none;
}

#control-panel {
  position: relative;
  padding: 12px 16px;
}

.panel-border { position: absolute; top: 0; bottom: 0; }
.panel-border-left { left: 0; }
.panel-border-right { right: 0; }

#control-panel .panel-row {
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}
#control-panel .panel-row + .panel-row {
  margin-top: 8px;
}

#control-panel label {
  font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
  font-size: 13px;
  color: #FFFFFF;
  white-space: nowrap;
  text-shadow: 0 0 4px rgba(255,255,255,0.15);
}

.btn {
  font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
  font-size: 13px;
  color: #FFFFFF;
  background: transparent;
  border: 1px solid #555555;
  padding: 6px 14px;
  cursor: pointer;
  text-shadow: 0 0 4px rgba(255,255,255,0.15);
  white-space: nowrap;
}
.btn:hover { border-color: #FFFFFF; }
.btn:disabled { color: #333333; border-color: #222222; cursor: default; text-shadow: none; }
.btn.loop-active { border-color: #4fc3f7; color: #4fc3f7; text-shadow: 0 0 6px rgba(79,195,247,0.4); }

.crt-select {
  font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
  font-size: 13px;
  color: #FFFFFF;
  background: #0c0a02;
  border: 1px solid #555555;
  padding: 4px 6px;
  cursor: pointer;
  text-shadow: 0 0 4px rgba(255,255,255,0.15);
}
.crt-select:hover { border-color: #FFFFFF; }
.crt-select option { background: #0c0a02; color: #FFFFFF; }

/* ── KNOB ────────────────────────────── */
.knob-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  user-select: none;
  -webkit-user-select: none;
}
.knob-label {
  font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
  font-size: 11px;
  color: #FFFFFF;
  text-shadow: 0 0 4px rgba(255,255,255,0.15);
}
.knob {
  position: relative;
  border: 2px solid #555555;
  border-radius: 50%;
  cursor: grab;
  display: flex;
  align-items: center;
  justify-content: center;
}
.knob:hover { border-color: #FFFFFF; }
.knob:active { cursor: grabbing; }
.knob-tick {
  position: absolute;
  width: 2px;
  background: #FFFFFF;
  top: 4px;
  left: 50%;
  margin-left: -1px;
  pointer-events: none;
}
.knob-xs { width: 38px; height: 38px; }
.knob-xs .knob-tick { height: 10px; transform-origin: center 13px; }
.knob-sm { width: 52px; height: 52px; }
.knob-sm .knob-tick { height: 14px; transform-origin: center 20px; }
.knob-lg { width: 100px; height: 100px; }
.knob-lg .knob-tick { height: 28px; transform-origin: center 44px; }

.knob-value {
  font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
  font-size: 10px;
  color: #888;
  text-shadow: none;
}

/* ── PITCH SLIDER ────────────────────── */
.pitch-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  user-select: none;
  -webkit-user-select: none;
}
.pitch-slider-outer {
  width: 22px;
  height: 134px;
  display: flex;
  align-items: center;
  justify-content: center;
}
#pitch-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 134px;
  min-width: 134px;
  height: 4px;
  background: #333;
  outline: none;
  border-radius: 0;
  transform: rotate(-90deg);
  transform-origin: center center;
}
#pitch-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 10px;
  height: 22px;
  background: #FFFFFF;
  cursor: grab;
  border: none;
  border-radius: 0;
}
#pitch-slider::-moz-range-thumb {
  width: 10px;
  height: 22px;
  background: #FFFFFF;
  cursor: grab;
  border: none;
  border-radius: 0;
}

.nudge-row {
  display: flex;
  gap: 4px;
}
.nudge-btn {
  font-size: 11px !important;
  padding: 3px 8px !important;
  min-width: 24px;
}

/* ── WAVEFORM ────────────────────────── */
#waveform-canvas {
  display: block;
  border: 1px solid #333;
  image-rendering: pixelated;
}

/* ── LAYOUT ──────────────────────────── */
.deck-body {
  display: flex;
  gap: 12px;
  align-items: stretch;
  padding: 8px 10px;
  position: relative;
  justify-content: center;
}
.deck-left {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 4px;
  min-width: 40px;
}
.deck-main {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.eq-row {
  display: flex;
  gap: 20px;
  align-items: center;
  justify-content: center;
}

#output-select { max-width: 220px; }
#midi-select { max-width: 220px; }

.midi-popup {
  position: fixed;
  background: #111;
  border: 1px solid #555;
  padding: 10px 12px;
  font-family: Menlo, Consolas, monospace;
  font-size: 11px;
  color: #e0e0e0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.6);
  min-width: 120px;
}
.midi-popup .mp-title { font-size: 10px; color: #888; letter-spacing: 1px; }
.midi-popup .mp-row { display: flex; align-items: center; gap: 6px; }
.midi-popup input[type="number"] {
  width: 48px; background: #0a0a0a; border: 1px solid #444;
  color: #e0e0e0; font-family: Menlo, Consolas, monospace;
  font-size: 11px; padding: 2px 4px; text-align: center;
}
.midi-popup .mp-btn {
  background: #1a1a1a; border: 1px solid #444; color: #e0e0e0;
  font-family: Menlo, Consolas, monospace; font-size: 10px;
  padding: 3px 8px; cursor: pointer; letter-spacing: 0.5px; width: 100%;
}
.midi-popup .mp-btn:hover { border-color: #888; }
.midi-popup .mp-btn.learning {
  border-color: #e0e0e0; color: #fff; animation: mp-pulse 1s infinite;
}
@keyframes mp-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

@keyframes flicker {
  0%, 100% { opacity: 1; }
  93% { opacity: 0.92; }
  94% { opacity: 1; }
}
</style>
</head>
<body>
<div id="crt">
  <pre id="frame-top" class="frame-line"></pre>
  <pre id="display"></pre>

  <pre id="frame-mid" class="frame-line"></pre>

  <div class="deck-body">
    <pre id="border-left" class="frame-line panel-border panel-border-left"></pre>
    <pre id="border-right" class="frame-line panel-border panel-border-right"></pre>

    <div class="deck-left">
      <div class="knob-wrap" style="margin-top:14px;">
        <label class="knob-label">TRIM</label>
        <div class="knob knob-xs" id="knob-trim" data-param="trim" data-min="-9" data-max="9" data-value="0">
          <div class="knob-tick"></div>
        </div>
        <label class="knob-value" id="trim-val">0 dB</label>
      </div>
      <div class="pitch-wrap" style="margin-top:8px;flex:1;justify-content:space-between;">
        <label class="knob-label">PITCH</label>
        <div class="pitch-slider-outer">
          <input type="range" id="pitch-slider" min="-12" max="12" step="0.1" value="0" oninput="changePitch()">
        </div>
        <div style="display:flex;align-items:center;gap:4px;">
          <label class="knob-value" id="pitch-val">0.0%</label>
          <button class="btn" id="btn-keylock" onclick="toggleKeylock()" style="padding:1px 4px;font-size:9px;line-height:1;" title="Key Lock">♪</button>
        </div>
        <div class="nudge-row">
          <button class="btn nudge-btn" id="btn-nudge-down">−</button>
          <button class="btn nudge-btn" id="btn-nudge-up">+</button>
        </div>
      </div>
    </div>

    <div class="deck-main">
      <div class="eq-row">
        <div class="knob-wrap">
          <label class="knob-label">BASS</label>
          <div class="knob knob-sm" id="knob-bass" data-param="bass" data-min="-12" data-max="12" data-value="0">
            <div class="knob-tick"></div>
          </div>
          <label class="knob-value" id="bass-val">0 dB</label>
        </div>
        <div class="knob-wrap">
          <label class="knob-label">TREBLE</label>
          <div class="knob knob-sm" id="knob-treble" data-param="treble" data-min="-12" data-max="12" data-value="0">
            <div class="knob-tick"></div>
          </div>
          <label class="knob-value" id="treble-val">0 dB</label>
        </div>
      </div>

      <div style="position:relative;display:inline-block;">
        <canvas id="waveform-canvas" width="220" height="80"></canvas>
        <button class="btn" id="waveform-zoom-btn" onclick="toggleWaveformZoom()" style="position:absolute;top:2px;right:3px;padding:1px 4px;font-size:9px;line-height:1;opacity:0.6;" title="Toggle zoom">⌕</button>
      </div>

      <div class="knob-wrap">
        <label class="knob-label">VOLUME</label>
        <div class="knob knob-lg" id="knob-vol" data-param="vol" data-min="-60" data-max="6" data-value="0">
          <div class="knob-tick"></div>
        </div>
        <label class="knob-value" id="vol-val">0 dB</label>
      </div>
    </div>
  </div>

  <pre id="frame-mid2" class="frame-line"></pre>
  <div id="control-panel">
    <pre id="border-left2" class="frame-line panel-border panel-border-left"></pre>
    <pre id="border-right2" class="frame-line panel-border panel-border-right"></pre>

    <div class="panel-row">
      <button class="btn" id="btn-load" onclick="document.getElementById('file-input').click()">⤒ LOAD</button>
      <input type="file" id="file-input" accept="audio/*" onchange="loadFile(event)" style="display:none;">
      <button class="btn" id="btn-play" onclick="togglePlay()" disabled>► PLAY</button>
      <button class="btn" id="btn-cue" disabled>◆ CUE</button>
    </div>

    <div class="panel-row">
      <label style="width:56px;text-align:right;">MIDI:</label>
      <select id="midi-select" class="crt-select" style="width:150px;" onchange="onMidiSelect()">
        <option value="">— NONE —</option>
      </select>
      <button class="btn" onclick="detectMidi()" style="padding:4px 6px;font-size:11px;" title="Detect MIDI devices">⟳</button>
      <span class="btn" style="padding:4px 8px;font-size:11px;visibility:hidden;">BUS</span>
      <span class="btn" style="padding:4px 8px;font-size:11px;visibility:hidden;">PFL</span>
    </div>

    <div class="panel-row">
      <label style="width:56px;text-align:right;">OUTPUT:</label>
      <select id="output-select" class="crt-select" style="width:150px;" onchange="setOutputDevice()">
        <option value="">DEFAULT</option>
      </select>
      <button class="btn" onclick="detectOutputDevices()" style="padding:4px 6px;font-size:11px;" title="Detect output devices">⟳</button>
      <button class="btn" id="cue-toggle" onclick="toggleCueOut()" style="padding:4px 8px;font-size:11px;" title="Pre-fader listen (channels 3-4)">PFL</button>
      <button class="btn" id="bus-toggle" onclick="toggleBus()" style="padding:4px 8px;font-size:11px;">BUS</button>
    </div>


    <div class="panel-row">
      <label>BG:</label>
      <input type="color" id="color-bg" value="#0c0a02" onchange="applyColors()">
      <label>TEXT:</label>
      <input type="color" id="color-text" value="#FFFFFF" onchange="applyColors()">
    </div>
  </div>
  <pre id="frame-bot" class="frame-line"></pre>
</div>

<script>
// ── STATE ─────────────────────────────────────────
let audioCtx = null;
let audioBuffer = null;
let audioElement = null;
let mediaSourceNode = null;
let fileObjectUrl = null;
let outputGainNode = null;
let trimGainNode = null;
let bassFilter = null;
let trebleFilter = null;

let state = 'idle'; // idle | playing | paused
let fileName = '';
let fileDuration = 0;
let fileBPM = '';
let fileTitle = '';
let fileArtist = '';
let scrollOffset = 0;
let lastScrollTime = 0;
let cuePoint = 0;
let pitchRate = 1.0;
let keylockOn = false;

let waveformData = null;
let waveformHiRes = null;
let waveformZoomed = false;
const ZOOM_SECONDS = 10;

let scratchNode = null;
let scratchGainNode = null;
let scratchActive = false;
let scratchPosition = 0;
let scratchRate = 0;
let lastScrubTime = 0;
const DISPLAY_W = 36;

// ── FRAME ─────────────────────────────────────────
const bg = () => document.getElementById('color-bg').value;
const txt = () => document.getElementById('color-text').value;

function drawFrames() {
  const W = DISPLAY_W + 4;
  const top = '╔' + '═'.repeat(W) + '╗';
  const mid = '╠' + '═'.repeat(W) + '╣';
  const bot = '╚' + '═'.repeat(W) + '╝';
  document.getElementById('frame-top').textContent = top;
  document.getElementById('frame-mid').textContent = mid;
  document.getElementById('frame-mid2').textContent = mid;
  document.getElementById('frame-bot').textContent = bot;

  const bodyEl = document.querySelector('.deck-body');
  const bodyH = bodyEl ? bodyEl.offsetHeight : 200;
  const charH = 22;
  const lines = Math.max(1, Math.ceil(bodyH / charH));
  const border = new Array(lines).fill('║').join('\n');
  document.getElementById('border-left').textContent = border;
  document.getElementById('border-right').textContent = border;

  const panelEl = document.getElementById('control-panel');
  const panelH = panelEl ? panelEl.offsetHeight : 80;
  const pLines = Math.max(1, Math.ceil(panelH / charH));
  const pBorder = new Array(pLines).fill('║').join('\n');
  document.getElementById('border-left2').textContent = pBorder;
  document.getElementById('border-right2').textContent = pBorder;
}

// ── DISPLAY ───────────────────────────────────────
function lpad(s) { return s.slice(0, DISPLAY_W).padEnd(DISPLAY_W); }
function lpad2(left, right) {
  const col = 18;
  return lpad(left.padEnd(col) + right);
}

function fmtTime(sec) {
  if (!sec || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2, '0') + ':' + s.toFixed(2).padStart(5, '0');
}

function render() {
  const lines = [];
  const W = DISPLAY_W;

  lines.push('');
  const title = 'B B  D E C K  v1.0';
  lines.push(title.padStart(Math.floor((W + title.length) / 2)).padEnd(W));
  lines.push('');

  const statusTxt = state === 'playing' ? '► PLAYING' : state === 'paused' ? '■ PAUSED' : 'READY.';
  const fn = fileTitle && fileArtist ? fileArtist + ' -- ' + fileTitle
           : fileTitle ? fileTitle
           : fileName ? fileName : '(none)';
  const maxFn = DISPLAY_W - 8;
  let displayFn;
  if (fn.length > maxFn) {
    const padded = fn + '   ·   ';
    const now = performance.now();
    if (now - lastScrollTime > 180) {
      scrollOffset = (scrollOffset + 1) % padded.length;
      lastScrollTime = now;
    }
    const doubled = padded + padded;
    displayFn = doubled.slice(scrollOffset, scrollOffset + maxFn);
  } else {
    displayFn = fn;
    scrollOffset = 0;
  }

  lines.push(lpad('STATUS: ' + statusTxt));
  lines.push(lpad('FILE:   ' + displayFn));
  lines.push(lpad('LEN:    ' + fmtTime(fileDuration)));

  const pos = getCurrentPos();
  const remain = Math.max(0, fileDuration - pos);
  const pitchPct = ((pitchRate - 1) * 100).toFixed(1);
  const pitchStr = (pitchRate >= 1 ? '+' : '') + pitchPct + '%';

  const effectiveBPM = fileBPM ? (parseFloat(fileBPM) * pitchRate).toFixed(1) : '';
  const bpmStr = effectiveBPM ? effectiveBPM + ' BPM' : '---';
  lines.push(lpad2('BPM:    ' + bpmStr, 'REM: ' + fmtTime(remain)));
  lines.push(lpad2('POS:    ' + fmtTime(pos), 'PITCH: ' + pitchStr));
  lines.push(lpad('CUE:    ' + fmtTime(cuePoint)));
  lines.push('');

  const frameW = DISPLAY_W + 4;
  document.getElementById('display').textContent = lines.map(l => {
    const content = ('  ' + l).padEnd(frameW);
    return '║' + content + '║';
  }).join('\n');

  drawPlayhead();
  requestAnimationFrame(render);
}

function getCurrentPos() {
  if (audioElement && audioElement.src) return audioElement.currentTime;
  return 0;
}

// ── WAVEFORM ──────────────────────────────────────
function buildWaveformData() {
  if (!audioBuffer) { waveformData = null; waveformHiRes = null; return; }
  const canvas = document.getElementById('waveform-canvas');
  const W = canvas.width;
  const ch = audioBuffer.getChannelData(0);
  const data = new Float32Array(W);
  const step = ch.length / W;
  for (let i = 0; i < W; i++) {
    let max = 0;
    const start = Math.floor(i * step);
    const end = Math.min(start + Math.ceil(step), ch.length);
    for (let j = start; j < end; j++) {
      const v = Math.abs(ch[j]);
      if (v > max) max = v;
    }
    data[i] = max;
  }
  waveformData = data;

  const hiResPerSec = 100;
  const hiLen = Math.ceil(audioBuffer.duration * hiResPerSec);
  const hiData = new Float32Array(hiLen);
  const hiStep = ch.length / hiLen;
  for (let i = 0; i < hiLen; i++) {
    let max = 0;
    const start = Math.floor(i * hiStep);
    const end = Math.min(start + Math.ceil(hiStep), ch.length);
    for (let j = start; j < end; j++) {
      const v = Math.abs(ch[j]);
      if (v > max) max = v;
    }
    hiData[i] = max;
  }
  waveformHiRes = hiData;
}

function drawPlayhead() {
  const canvas = document.getElementById('waveform-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const textColor = txt();

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = bg();
  ctx.fillRect(0, 0, W, H);

  const trimVal = parseFloat(document.getElementById('knob-trim').dataset.value);
  const trimGain = trimVal <= -9 ? 0 : Math.pow(10, trimVal / 20);
  const mid = H / 2;

  if (waveformZoomed && waveformHiRes && fileDuration > 0) {
    const pos = getCurrentPos();
    const hiResPerSec = waveformHiRes.length / fileDuration;
    const samplesInView = Math.floor(ZOOM_SECONDS * hiResPerSec);
    const centerSample = Math.floor(pos * hiResPerSec);
    const startSample = centerSample - Math.floor(samplesInView / 2);

    ctx.fillStyle = textColor + '88';
    for (let i = 0; i < W; i++) {
      const si = startSample + Math.floor(i * samplesInView / W);
      if (si < 0 || si >= waveformHiRes.length) continue;
      const h = Math.min(waveformHiRes[si] * trimGain, 1) * mid * 0.9;
      ctx.fillRect(i, mid - h, 1, h * 2);
    }

    ctx.fillStyle = textColor;
    const playheadX = Math.floor(W / 2);
    ctx.fillRect(playheadX, 0, 1, H);

  } else if (waveformData) {
    ctx.fillStyle = textColor + '88';
    for (let i = 0; i < W; i++) {
      const h = Math.min(waveformData[i] * trimGain, 1) * mid * 0.9;
      ctx.fillRect(i, mid - h, 1, h * 2);
    }

    if (fileDuration > 0) {
      const pos = getCurrentPos();
      const x = Math.floor((pos / fileDuration) * W);
      ctx.fillStyle = textColor;
      ctx.fillRect(x, 0, 1, H);
    }
  } else {
    ctx.fillStyle = textColor + '33';
    ctx.font = '13px Menlo, Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('NO AUDIO LOADED', W / 2, H / 2 + 4);
  }
}

function toggleWaveformZoom() {
  waveformZoomed = !waveformZoomed;
  const btn = document.getElementById('waveform-zoom-btn');
  btn.classList.toggle('loop-active', waveformZoomed);
}

// ── AUDIO ─────────────────────────────────────────
function ensureAudioCtx() {
  if (!audioCtx) {
    audioCtx = new AudioContext();
    outputGainNode = audioCtx.createGain();
    if (!busOnly) outputGainNode.connect(audioCtx.destination);
    if (busBroadcasterNode) connectBusSender();

    trimGainNode = audioCtx.createGain();
    trimGainNode.gain.value = 1;

    bassFilter = audioCtx.createBiquadFilter();
    bassFilter.type = 'lowshelf';
    bassFilter.frequency.value = 800;
    bassFilter.gain.value = 0;

    trebleFilter = audioCtx.createBiquadFilter();
    trebleFilter.type = 'highshelf';
    trebleFilter.frequency.value = 800;
    trebleFilter.gain.value = 0;

    trimGainNode.connect(bassFilter);
    bassFilter.connect(trebleFilter);
    trebleFilter.connect(outputGainNode);

    audioElement = document.createElement('audio');
    audioElement.preservesPitch = false;
    mediaSourceNode = audioCtx.createMediaElementSource(audioElement);
    mediaSourceNode.connect(trimGainNode);

    scratchNode = audioCtx.createScriptProcessor(1024, 0, 2);
    scratchGainNode = audioCtx.createGain();
    scratchGainNode.gain.value = 0;
    scratchNode.connect(scratchGainNode);
    scratchGainNode.connect(trimGainNode);

    scratchNode.onaudioprocess = function(e) {
      const L = e.outputBuffer.getChannelData(0);
      const R = e.outputBuffer.getChannelData(1);
      if (!scratchActive || !audioBuffer) {
        for (let i = 0; i < L.length; i++) { L[i] = 0; R[i] = 0; }
        return;
      }
      const srcL = audioBuffer.getChannelData(0);
      const srcR = audioBuffer.numberOfChannels > 1 ? audioBuffer.getChannelData(1) : srcL;
      const len = audioBuffer.length;
      const elapsed = performance.now() - lastScrubTime;
      const decay = elapsed > 60;
      for (let i = 0; i < L.length; i++) {
        if (decay) scratchRate *= 0.993;
        const idx = Math.floor(scratchPosition);
        if (idx >= 0 && idx < len - 1) {
          const frac = scratchPosition - idx;
          L[i] = srcL[idx] * (1 - frac) + srcL[idx + 1] * frac;
          R[i] = srcR[idx] * (1 - frac) + srcR[idx + 1] * frac;
        } else {
          L[i] = 0; R[i] = 0;
        }
        scratchPosition += scratchRate;
      }
      if (decay && Math.abs(scratchRate) < 0.001) scratchRate = 0;
    };

    audioElement.addEventListener('ended', () => {
      state = 'idle';
      updateButtons();
    });

    updatePflAvailability();
  }
}

async function loadFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  loadTrack(file);
  e.target.value = '';
}

function parseID3v2(buf) {
  const d = new DataView(buf);
  const u8 = new Uint8Array(buf);
  if (u8[0] !== 0x49 || u8[1] !== 0x44 || u8[2] !== 0x33) return {};
  const ver = u8[3];
  const tagSize = (u8[6] << 21) | (u8[7] << 14) | (u8[8] << 7) | u8[9];
  const headerSize = ver >= 3 ? 10 : 6;
  const result = {};
  let pos = 10;
  const end = Math.min(10 + tagSize, buf.byteLength);

  while (pos < end - headerSize) {
    let frameId, frameSize;
    if (ver >= 3) {
      frameId = String.fromCharCode(u8[pos], u8[pos+1], u8[pos+2], u8[pos+3]);
      if (frameId[0] === '\0') break;
      frameSize = ver === 4
        ? (u8[pos+4] << 21) | (u8[pos+5] << 14) | (u8[pos+6] << 7) | u8[pos+7]
        : d.getUint32(pos + 4);
      pos += 10;
    } else {
      frameId = String.fromCharCode(u8[pos], u8[pos+1], u8[pos+2]);
      if (frameId[0] === '\0') break;
      frameSize = (u8[pos+3] << 16) | (u8[pos+4] << 8) | u8[pos+5];
      pos += 6;
    }
    if (frameSize <= 0 || pos + frameSize > end) break;

    const wanted = { TBPM: 'bpm', TIT2: 'title', TPE1: 'artist', TBP: 'bpm', TT2: 'title', TP1: 'artist' };
    if (wanted[frameId]) {
      const enc = u8[pos];
      let text = '';
      if (enc === 0 || enc === 3) {
        const bytes = u8.slice(pos + 1, pos + frameSize);
        text = new TextDecoder(enc === 3 ? 'utf-8' : 'iso-8859-1').decode(bytes);
      } else if (enc === 1 || enc === 2) {
        const start = enc === 1 ? pos + 3 : pos + 1;
        const slice = buf.slice(start, pos + frameSize);
        text = new TextDecoder('utf-16').decode(slice);
      }
      result[wanted[frameId]] = text.replace(/\0/g, '').trim();
    }
    pos += frameSize;
  }
  return result;
}

async function loadTrack(file) {
  if (state === 'playing') stopAudio();
  ensureAudioCtx();

  if (fileObjectUrl) URL.revokeObjectURL(fileObjectUrl);
  fileObjectUrl = URL.createObjectURL(file);
  audioElement.src = fileObjectUrl;
  audioElement.playbackRate = pitchRate;

  fileName = file.name;
  fileBPM = '';
  fileTitle = '';
  fileArtist = '';
  scrollOffset = 0;
  lastScrollTime = 0;
  audioBuffer = null;
  waveformData = null;
  waveformHiRes = null;
  cuePoint = 0;
  state = 'idle';

  await new Promise(r => { audioElement.onloadedmetadata = r; });
  fileDuration = audioElement.duration;
  updateButtons();

  try {
    const arrayBuf = await file.arrayBuffer();
    const tags = parseID3v2(arrayBuf);
    if (tags.bpm) fileBPM = tags.bpm;
    if (tags.title) fileTitle = tags.title;
    if (tags.artist) fileArtist = tags.artist;
    audioBuffer = await audioCtx.decodeAudioData(arrayBuf);
    buildWaveformData();
  } catch (err) {}
}

function togglePlay() {
  if (cueHeld) {
    cueHeld = false;
    updateButtons();
    return;
  }
  if (state === 'playing') {
    stopAudio();
  } else {
    playAudio();
  }
}

function playAudio() {
  if (!audioElement || !audioElement.src) return;
  ensureAudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  if (audioElement.currentTime >= fileDuration) audioElement.currentTime = 0;
  audioElement.playbackRate = pitchRate;
  audioElement.play();
  state = 'playing';
  updateButtons();
}

function pauseAudio() {
  if (state !== 'playing') return;
  audioElement.pause();
  state = 'paused';
  updateButtons();
}

function stopAudio() {
  if (audioElement) {
    audioElement.pause();
    audioElement.currentTime = cuePoint;
  }
  state = 'idle';
  updateButtons();
}

let cueHeld = false;

function goToCue() {
  if (!audioElement || !audioElement.src) return;
  if (state === 'playing') {
    audioElement.pause();
    audioElement.currentTime = cuePoint;
    state = 'paused';
    updateButtons();
  } else if (state === 'paused' || state === 'idle') {
    cuePoint = audioElement.currentTime;
    cueHeld = true;
    ensureAudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    audioElement.playbackRate = pitchRate;
    audioElement.play();
    state = 'playing';
    updateButtons();
  }
}

function releaseCue() {
  if (!cueHeld) return;
  cueHeld = false;
  if (state === 'playing') {
    audioElement.pause();
    audioElement.currentTime = cuePoint;
    state = 'paused';
    updateButtons();
  }
}

// ── WAVEFORM SEEK ─────────────────────────────────
(function() {
  const canvas = document.getElementById('waveform-canvas');
  let seeking = false;
  let scrubStartX = 0;
  let scrubStartTime = 0;
  let wasPlaying = false;

  function seekAbsolute(x) {
    if (!audioElement || !audioElement.src) return;
    const rect = canvas.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (x - rect.left) / rect.width));
    audioElement.currentTime = ratio * fileDuration;
    if (state !== 'playing' && !cueHeld) {
      state = 'paused';
      updateButtons();
    }
  }

  function scrub(x) {
    if (!audioElement || !audioElement.src || !fileDuration) return;
    const rect = canvas.getBoundingClientRect();
    const dx = x - scrubStartX;
    const secondsPerPixel = ZOOM_SECONDS / rect.width;
    const newTime = Math.max(0, Math.min(fileDuration, scrubStartTime - dx * secondsPerPixel));
    audioElement.currentTime = newTime;

    if (scratchActive && audioBuffer) {
      const newPos = newTime * audioBuffer.sampleRate;
      const now = performance.now();
      const dtMs = now - lastScrubTime;
      if (dtMs > 0 && lastScrubTime > 0) {
        const dSamples = newPos - scratchPosition;
        const outputSamples = (dtMs / 1000) * audioBuffer.sampleRate;
        scratchRate = dSamples / outputSamples;
      }
      scratchPosition = newPos;
      lastScrubTime = now;
    }
  }

  function onSeekStart(x) {
    if (!audioElement || !audioElement.src) return;
    seeking = true;
    if (waveformZoomed) {
      scrubStartX = x;
      scrubStartTime = getCurrentPos();
      wasPlaying = state === 'playing';
      if (wasPlaying && !cueHeld) audioElement.pause();
      if (audioBuffer && scratchGainNode && audioCtx && !cueHeld) {
        scratchActive = true;
        scratchPosition = scrubStartTime * audioBuffer.sampleRate;
        scratchRate = 0;
        lastScrubTime = performance.now();
        scratchGainNode.gain.setValueAtTime(1, audioCtx.currentTime);
      }
    } else {
      seekAbsolute(x);
    }
  }

  function onSeekMove(x) {
    if (!seeking) return;
    if (waveformZoomed) {
      scrub(x);
    } else {
      seekAbsolute(x);
    }
  }

  function onSeekEnd() {
    if (scratchActive && scratchGainNode && audioCtx) {
      scratchGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      scratchActive = false;
      scratchRate = 0;
      if (audioBuffer) {
        audioElement.currentTime = Math.max(0, Math.min(fileDuration, scratchPosition / audioBuffer.sampleRate));
      }
    }
    if (seeking && waveformZoomed && wasPlaying && !cueHeld) {
      audioElement.play();
    }
    if (!wasPlaying && seeking && !cueHeld) {
      state = 'paused';
      updateButtons();
    }
    seeking = false;
  }

  canvas.addEventListener('mousedown', (e) => { onSeekStart(e.clientX); });
  document.addEventListener('mousemove', (e) => { onSeekMove(e.clientX); });
  document.addEventListener('mouseup', () => { onSeekEnd(); });

  canvas.addEventListener('touchstart', (e) => { onSeekStart(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', (e) => { if (seeking && e.touches.length) onSeekMove(e.touches[0].clientX); }, { passive: false });
  document.addEventListener('touchend', () => { onSeekEnd(); });
})();

// ── NUDGE ──────────────────────────────────────────
const NUDGE_PCT = 8;
const NUDGE_RAMP = 0.25;
let nudgeAnimId = null;
let nudgeTargetRate = null;
let nudgeFromRate = null;
let nudgeStartMs = null;

function nudgeStart(direction) {
  if (!audioElement) return;
  nudgeActive = true;
  if (nudgeAnimId) cancelAnimationFrame(nudgeAnimId);
  nudgeTargetRate = pitchRate + direction * (NUDGE_PCT / 100);
  nudgeFromRate = audioElement.playbackRate;
  nudgeStartMs = performance.now();
  nudgeAnimate();
}

function nudgeAnimate() {
  const t = Math.min((performance.now() - nudgeStartMs) / (NUDGE_RAMP * 1000), 1);
  audioElement.playbackRate = nudgeFromRate + (nudgeTargetRate - nudgeFromRate) * t;
  if (t < 1) nudgeAnimId = requestAnimationFrame(nudgeAnimate);
  else nudgeAnimId = null;
}

let nudgeActive = false;

function nudgeEnd() {
  if (!audioElement || !nudgeActive) return;
  nudgeActive = false;
  if (nudgeAnimId) cancelAnimationFrame(nudgeAnimId);
  nudgeTargetRate = pitchRate;
  nudgeFromRate = audioElement.playbackRate;
  nudgeStartMs = performance.now();
  nudgeAnimate();
}

(function initNudge() {
  const btnDown = document.getElementById('btn-nudge-down');
  const btnUp = document.getElementById('btn-nudge-up');

  btnDown.addEventListener('mousedown', (e) => { e.preventDefault(); nudgeStart(-1); });
  btnDown.addEventListener('touchstart', (e) => { e.preventDefault(); nudgeStart(-1); }, { passive: false });
  btnUp.addEventListener('mousedown', (e) => { e.preventDefault(); nudgeStart(1); });
  btnUp.addEventListener('touchstart', (e) => { e.preventDefault(); nudgeStart(1); }, { passive: false });

  document.addEventListener('mouseup', nudgeEnd);
  document.addEventListener('touchend', nudgeEnd);
})();

(function initCue() {

})();

// ── KNOBS ─────────────────────────────────────────
const KNOB_MIN_ANGLE = -135;
const KNOB_MAX_ANGLE = 135;
const KNOB_RANGE = KNOB_MAX_ANGLE - KNOB_MIN_ANGLE;

function knobAngle(value, min, max) {
  const ratio = (value - min) / (max - min);
  return KNOB_MIN_ANGLE + ratio * KNOB_RANGE;
}

function updateKnobVisual(el) {
  const val = parseFloat(el.dataset.value);
  const min = parseFloat(el.dataset.min);
  const max = parseFloat(el.dataset.max);
  const angle = knobAngle(val, min, max);
  el.querySelector('.knob-tick').style.transform = `rotate(${angle}deg)`;
}

function fmtDb(value) {
  const s = value.toFixed(1);
  return (value > 0 ? '+' : '') + s + ' dB';
}

function applyKnobParam(param, value) {
  if (param === 'trim') {
    const label = value <= -9 ? '-∞ dB' : fmtDb(value);
    document.getElementById('trim-val').textContent = label;
    if (trimGainNode && audioCtx) {
      const gain = value <= -9 ? 0 : Math.pow(10, value / 20);
      trimGainNode.gain.linearRampToValueAtTime(gain, audioCtx.currentTime + 0.02);
    }
  } else if (param === 'bass') {
    document.getElementById('bass-val').textContent = fmtDb(value);
    if (bassFilter && audioCtx) bassFilter.gain.linearRampToValueAtTime(value, audioCtx.currentTime + 0.02);
  } else if (param === 'treble') {
    document.getElementById('treble-val').textContent = fmtDb(value);
    if (trebleFilter && audioCtx) trebleFilter.gain.linearRampToValueAtTime(value, audioCtx.currentTime + 0.02);
  } else if (param === 'vol') {
    let gain;
    if (value <= -60) {
      gain = 0;
    } else if (value >= 0) {
      gain = Math.pow(10, value / 20);
    } else {
      const t = (value + 60) / 60;
      const curvedDb = -60 + 60 * Math.pow(t, 0.5);
      gain = Math.pow(10, curvedDb / 20);
    }
    const realDb = gain > 0 ? 20 * Math.log10(gain) : -Infinity;
    const label = !isFinite(realDb) ? '-∞ dB' : fmtDb(realDb);
    document.getElementById('vol-val').textContent = label;
    if (outputGainNode && audioCtx) {
      outputGainNode.gain.linearRampToValueAtTime(gain, audioCtx.currentTime + 0.02);
    }
  }
}

(function initKnobs() {
  document.querySelectorAll('.knob').forEach(el => {
    updateKnobVisual(el);

    let dragging = false;
    let startY = 0;
    let startVal = 0;

    function onStart(y) {
      dragging = true;
      startY = y;
      startVal = parseFloat(el.dataset.value);
      document.body.style.cursor = 'grabbing';
    }

    function onMove(y) {
      if (!dragging) return;
      const min = parseFloat(el.dataset.min);
      const max = parseFloat(el.dataset.max);
      const range = max - min;
      const delta = (startY - y) * (range / 150);
      const newVal = Math.round(Math.max(min, Math.min(max, startVal + delta)) * 10) / 10;
      el.dataset.value = newVal;
      updateKnobVisual(el);
      applyKnobParam(el.dataset.param, newVal);
    }

    function onEnd() {
      dragging = false;
      document.body.style.cursor = '';
    }

    el.addEventListener('mousedown', (e) => { onStart(e.clientY); e.preventDefault(); });
    document.addEventListener('mousemove', (e) => { if (dragging) onMove(e.clientY); });
    document.addEventListener('mouseup', onEnd);

    el.addEventListener('touchstart', (e) => { onStart(e.touches[0].clientY); e.preventDefault(); }, { passive: false });
    document.addEventListener('touchmove', (e) => { if (dragging && e.touches.length) onMove(e.touches[0].clientY); }, { passive: false });
    document.addEventListener('touchend', onEnd);

    el.addEventListener('dblclick', () => {
      el.dataset.value = 0;
      updateKnobVisual(el);
      applyKnobParam(el.dataset.param, 0);
    });
  });
})();

// ── OUTPUT DEVICE & BUS ─────────────────────────────────

let busOnly = false;
let cueListening = false;
let pflSetup = false;
let pflMerger = null;
let pflGainNode = null;
let pflSplitter = null;
let mainSplitter = null;

async function enumerateOutputDevices() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const sel = document.getElementById('output-select');
    const current = sel.value;
    sel.innerHTML = '<option value="">DEFAULT</option>';
    for (const d of devices) {
      if (d.kind !== 'audiooutput') continue;
      if (d.deviceId === 'default' || d.deviceId === '') continue;
      const label = d.label || ('Output ' + d.deviceId.slice(0, 8));
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.textContent = label;
      sel.appendChild(opt);
    }
    if (current) sel.value = current;
  } catch(e) {}
}

async function detectOutputDevices() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop());
  } catch(e) {}
  await enumerateOutputDevices();
}

async function setOutputDevice() {
  if (!audioCtx) return;
  if (busOnly) return;
  // tear down PFL when device changes so it re-inits for the new device
  if (pflSetup) {
    teardownMultichannelPFL();
    if (cueListening) {
      cueListening = false;
      document.getElementById('cue-toggle').classList.remove('loop-active');
    }
  }
  const val = document.getElementById('output-select').value;
  try {
    if (audioCtx.setSinkId) await audioCtx.setSinkId(val || '');
  } catch(e) {}
  updatePflAvailability();
}

function teardownMultichannelPFL() {
  if (!pflSetup || !audioCtx) return;
  try { pflMerger.disconnect(); } catch(e) {}
  try { mainSplitter.disconnect(); } catch(e) {}
  try { pflSplitter.disconnect(); } catch(e) {}
  try { pflGainNode.disconnect(); } catch(e) {}
  try { outputGainNode.disconnect(mainSplitter); } catch(e) {}
  try { trebleFilter.disconnect(pflGainNode); } catch(e) {}
  if (!busOnly) outputGainNode.connect(audioCtx.destination);
  audioCtx.destination.channelCount = 2;
  audioCtx.destination.channelCountMode = 'explicit';
  pflMerger = null;
  mainSplitter = null;
  pflSplitter = null;
  pflGainNode = null;
  pflSetup = false;
}

function updatePflAvailability() {
  document.getElementById('cue-toggle').disabled = false;
}

function setupMultichannelPFL() {
  if (pflSetup || !audioCtx) return false;
  const dest = audioCtx.destination;
  if (dest.maxChannelCount < 4) return false;

  dest.channelCount = 4;
  dest.channelCountMode = 'explicit';
  dest.channelInterpretation = 'discrete';

  pflMerger = audioCtx.createChannelMerger(4);
  mainSplitter = audioCtx.createChannelSplitter(2);
  pflSplitter = audioCtx.createChannelSplitter(2);
  pflGainNode = audioCtx.createGain();
  pflGainNode.gain.value = 0;

  try { outputGainNode.disconnect(audioCtx.destination); } catch(e) {}

  outputGainNode.connect(mainSplitter);
  mainSplitter.connect(pflMerger, 0, 0);
  mainSplitter.connect(pflMerger, 1, 1);

  trebleFilter.connect(pflGainNode);
  pflGainNode.connect(pflSplitter);
  pflSplitter.connect(pflMerger, 0, 2);
  pflSplitter.connect(pflMerger, 1, 3);

  if (!busOnly) pflMerger.connect(dest);

  pflSetup = true;
  return true;
}

async function toggleCueOut() {
  if (!audioCtx) return;
  if (!pflSetup) {
    if (!setupMultichannelPFL()) return;
    // re-apply setSinkId so Chrome restarts the output stream at 4 channels
    const val = document.getElementById('output-select').value;
    if (audioCtx.setSinkId && val) {
      try { await audioCtx.setSinkId(val); } catch(e) {}
    }
  }
  cueListening = !cueListening;
  const btn = document.getElementById('cue-toggle');
  btn.classList.toggle('loop-active', cueListening);
  pflGainNode.gain.setValueAtTime(cueListening ? 1 : 0, audioCtx.currentTime);
}

async function toggleBus() {
  busOnly = !busOnly;
  const btn = document.getElementById('bus-toggle');
  btn.classList.toggle('loop-active', busOnly);
  if (!audioCtx || !outputGainNode) return;
  const finalNode = pflSetup ? pflMerger : outputGainNode;
  if (busOnly) {
    try { finalNode.disconnect(audioCtx.destination); } catch(e) {}
    await initBusBroadcaster();
    connectBusSender();
  } else {
    disconnectBusSender();
    try { finalNode.connect(audioCtx.destination); } catch(e) {}
    setOutputDevice();
  }
}

navigator.mediaDevices?.addEventListener('devicechange', () => enumerateOutputDevices());

// ── AUDIO BUS (cross-tab routing) ─────────────────────

const BUS_BUFFER_SIZE = 8192;
const BUS_ID = 'deck_' + Math.random().toString(36).slice(2, 8);
const BUS_NAME = 'BB DECK';
let busChannel = null;
let busBroadcasterNode = null;
let busSAB = null;
let busSubscribers = new Set();
let busWorkletReady = false;

const busSenderSABCode = `
class BusSenderSAB extends AudioWorkletProcessor {
  constructor(options) {
    super();
    const { sab, bufferSize } = options.processorOptions;
    this.indices = new Int32Array(sab, 0, 4);
    this.samples = new Float32Array(sab, 16);
    this.bufferSize = bufferSize;
  }
  process(inputs) {
    const input = inputs[0][0];
    if (!input) return true;
    const writeIdx = Atomics.load(this.indices, 0);
    for (let i = 0; i < input.length; i++) {
      this.samples[(writeIdx + i) % this.bufferSize] = input[i];
    }
    Atomics.store(this.indices, 0, (writeIdx + input.length) % this.bufferSize);
    return true;
  }
}
registerProcessor('bus-sender-sab', BusSenderSAB);
`;

const busSenderMPCode = `
class BusSenderMP extends AudioWorkletProcessor {
  constructor() {
    super();
    this.active = false;
    this.port.onmessage = (e) => { this.active = e.data.active; };
  }
  process(inputs) {
    const input = inputs[0][0];
    if (!input || !this.active) return true;
    const copy = new Float32Array(input.length);
    copy.set(input);
    this.port.postMessage(copy, [copy.buffer]);
    return true;
  }
}
registerProcessor('bus-sender-mp', BusSenderMP);
`;

async function initBusWorklets() {
  if (busWorkletReady || !audioCtx) return;
  const useSAB = typeof SharedArrayBuffer !== 'undefined' && crossOriginIsolated;
  const code = useSAB ? busSenderSABCode : busSenderMPCode;
  const blob = new Blob([code], { type: 'application/javascript' });
  const url = URL.createObjectURL(blob);
  await audioCtx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);
  busWorkletReady = true;
}

async function initBusBroadcaster() {
  if (!audioCtx || busBroadcasterNode) return;
  await initBusWorklets();
  const useSAB = typeof SharedArrayBuffer !== 'undefined' && crossOriginIsolated;
  if (useSAB) {
    const byteLength = 16 + BUS_BUFFER_SIZE * 4;
    busSAB = new SharedArrayBuffer(byteLength);
    const indices = new Int32Array(busSAB, 0, 4);
    Atomics.store(indices, 0, 0);
    Atomics.store(indices, 1, 0);
    Atomics.store(indices, 2, BUS_BUFFER_SIZE);
    Atomics.store(indices, 3, 1);
    busBroadcasterNode = new AudioWorkletNode(audioCtx, 'bus-sender-sab', {
      processorOptions: { sab: busSAB, bufferSize: BUS_BUFFER_SIZE }
    });
  } else {
    busBroadcasterNode = new AudioWorkletNode(audioCtx, 'bus-sender-mp');
    busBroadcasterNode.port.onmessage = (e) => {
      if (busSubscribers.size > 0 && busChannel) {
        busChannel.postMessage({ type: 'audio', id: BUS_ID, samples: e.data });
      }
    };
  }
}

function connectBusSender() {
  if (!outputGainNode || !busBroadcasterNode) return;
  try { outputGainNode.connect(busBroadcasterNode); } catch(e) {}
}

function disconnectBusSender() {
  if (!busBroadcasterNode) return;
  try { outputGainNode.disconnect(busBroadcasterNode); } catch(e) {}
}

function initBusChannel() {
  if (busChannel) return;
  busChannel = new BroadcastChannel('bb-audio-bus');

  const announce = () => {
    busChannel.postMessage({
      type: 'announce', id: BUS_ID, name: BUS_NAME,
      sab: busSAB || null
    });
  };

  busChannel.onmessage = (e) => {
    const msg = e.data;
    if (msg.type === 'discover') {
      announce();
    } else if (msg.type === 'subscribe' && msg.sourceId === BUS_ID) {
      busSubscribers.add(msg.subscriberId);
      if (busBroadcasterNode && busBroadcasterNode.port) {
        busBroadcasterNode.port.postMessage({ active: true });
      }
    } else if (msg.type === 'unsubscribe' && msg.sourceId === BUS_ID) {
      busSubscribers.delete(msg.subscriberId);
      if (busSubscribers.size === 0 && busBroadcasterNode && busBroadcasterNode.port) {
        busBroadcasterNode.port.postMessage({ active: false });
      }
    }
  };

  announce();
  setInterval(announce, 3000);

  window.addEventListener('beforeunload', () => {
    busChannel.postMessage({ type: 'leave', id: BUS_ID });
  });
}

initBusChannel();

// ── INIT ──────────────────────────────────────────
drawFrames();
updateButtons();
requestAnimationFrame(render);

document.querySelectorAll('select, input[type="range"]').forEach(el => {
  el.addEventListener('change', () => el.blur());
});

// ── KEYBOARD ─────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if ((e.target.tagName === 'INPUT' && e.target.type !== 'range') || e.target.tagName === 'SELECT') return;
  if (e.repeat && e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if (e.key === 'q') goToCue();
  else if (e.key === 'w') togglePlay();
  else if (e.key === 't') nudgeStart(-1);
  else if (e.key === 'y') nudgeStart(1);
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault();
    const knob = document.getElementById('knob-vol');
    const min = parseFloat(knob.dataset.min);
    const max = parseFloat(knob.dataset.max);
    const step = e.shiftKey ? 1 : 4;
    const cur = parseFloat(knob.dataset.value);
    const next = Math.max(min, Math.min(max, cur + (e.key === 'ArrowRight' ? step : -step)));
    knob.dataset.value = next;
    updateKnobVisual(knob);
    applyKnobParam(knob.dataset.param, next);
  }
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'q') releaseCue();
  else if (e.key === 't' || e.key === 'y') nudgeEnd();
});
window.addEventListener('blur', () => {
  releaseCue();
  nudgeEnd();
});

// ── DRAG & DROP ──────────────────────────────────
(() => {
  const crt = document.getElementById('crt');
  crt.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  crt.addEventListener('drop', (e) => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('audio/')) loadTrack(file);
  });
})();

// ── MIDI ─────────────────────────────────────────
let midiAccess = null;
let selectedMidiId = '';
const ccToParam = {};
const paramToCC = {};
const noteToAction = {};
const actionToNote = {};
let midiLearnTarget = null;
let midiLearnType = null; // 'cc' or 'note'
let midiPopupEl = null;

async function detectMidi() {
  try {
    midiAccess = await navigator.requestMIDIAccess();
    populateMidiDevices();
    midiAccess.onstatechange = populateMidiDevices;
  } catch (e) {}
}

function populateMidiDevices() {
  const sel = document.getElementById('midi-select');
  const prev = sel.value;
  sel.innerHTML = '<option value="">— NONE —</option>';
  if (midiAccess) {
    for (const input of midiAccess.inputs.values()) {
      const opt = document.createElement('option');
      opt.value = input.id;
      opt.textContent = input.name;
      sel.appendChild(opt);
    }
  }
  const detectOpt = document.createElement('option');
  detectOpt.value = '__detect__';
  detectOpt.textContent = '↻ DETECT';
  sel.appendChild(detectOpt);
  if (prev && prev !== '__detect__' && sel.querySelector(`option[value="${CSS.escape(prev)}"]`)) {
    sel.value = prev;
  } else if (sel.options.length > 2) {
    sel.value = sel.options[1].value;
  }
  connectMidiInput();
}

function onMidiSelect() {
  const sel = document.getElementById('midi-select');
  if (sel.value === '__detect__') { sel.value = ''; detectMidi(); return; }
  connectMidiInput();
}

function connectMidiInput() {
  if (!midiAccess) return;
  for (const input of midiAccess.inputs.values()) input.onmidimessage = null;
  selectedMidiId = document.getElementById('midi-select').value;
  if (!selectedMidiId) return;
  const input = midiAccess.inputs.get(selectedMidiId);
  if (input) input.onmidimessage = onMidiMessage;
}

function onMidiMessage(e) {
  const [status, data1, data2] = e.data;
  const cmd = status & 0xF0;

  if (cmd === 0xB0) {
    if (midiLearnTarget && midiLearnType === 'cc') {
      assignCC(data1, midiLearnTarget);
      if (midiPopupEl) {
        const relChk = midiPopupEl.querySelector('#mp-rel-chk');
        if (relChk) ccRelative[data1] = relChk.checked;
      }
      closeMidiPopup(false);
      return;
    }
    if (ccToParam[data1]) {
      for (const pid of ccToParam[data1]) applyCCValue(pid, data2);
    }
  } else if (cmd === 0x90 && data2 > 0) {
    if (midiLearnTarget && midiLearnType === 'note') {
      assignNote(data1, midiLearnTarget);
      closeMidiPopup(false);
      return;
    }
    if (noteToAction[data1]) {
      for (const aid of noteToAction[data1]) triggerAction(aid);
    }
  } else if (cmd === 0x80 || (cmd === 0x90 && data2 === 0)) {
    if (noteToAction[data1]) {
      for (const aid of noteToAction[data1]) releaseAction(aid);
    }
  }
}

function assignCC(cc, paramId) {
  if (paramToCC[paramId] !== undefined) {
    const old = paramToCC[paramId];
    if (ccToParam[old]) {
      ccToParam[old] = ccToParam[old].filter(p => p !== paramId);
      if (ccToParam[old].length === 0) delete ccToParam[old];
    }
  }
  if (!ccToParam[cc]) ccToParam[cc] = [];
  if (!ccToParam[cc].includes(paramId)) ccToParam[cc].push(paramId);
  paramToCC[paramId] = cc;
  if (paramId === 'jog') ccRelative[cc] = true;
}

function clearCC(paramId) {
  const cc = paramToCC[paramId];
  if (cc !== undefined) {
    if (ccToParam[cc]) {
      ccToParam[cc] = ccToParam[cc].filter(p => p !== paramId);
      if (ccToParam[cc].length === 0) delete ccToParam[cc];
    }
    delete paramToCC[paramId];
  }
}

function assignNote(note, actionId) {
  if (actionToNote[actionId] !== undefined) {
    const old = actionToNote[actionId];
    if (noteToAction[old]) {
      noteToAction[old] = noteToAction[old].filter(a => a !== actionId);
      if (noteToAction[old].length === 0) delete noteToAction[old];
    }
  }
  if (!noteToAction[note]) noteToAction[note] = [];
  if (!noteToAction[note].includes(actionId)) noteToAction[note].push(actionId);
  actionToNote[actionId] = note;
}

function clearNote(actionId) {
  const note = actionToNote[actionId];
  if (note !== undefined) {
    if (noteToAction[note]) {
      noteToAction[note] = noteToAction[note].filter(a => a !== actionId);
      if (noteToAction[note].length === 0) delete noteToAction[note];
    }
    delete actionToNote[actionId];
  }
}

const ccRelative = {};

function decodeRelative(value) {
  if (value === 0 || value === 64) return 0;
  if (value <= 63) return value;
  return 64 - value;
}

let jogWasPlaying = false;

function applyJog(ccVal) {
  if (!audioElement || !audioElement.src || !audioBuffer || !audioCtx) return;
  const delta = decodeRelative(ccVal);
  if (delta === 0) return;
  const sensitivity = 0.015;
  const seekDelta = delta * sensitivity;

  if (!scratchActive) {
    scratchActive = true;
    jogWasPlaying = state === 'playing';
    scratchPosition = getCurrentPos() * audioBuffer.sampleRate;
    scratchGainNode.gain.setValueAtTime(1, audioCtx.currentTime);
    if (jogWasPlaying) audioElement.pause();
  }
  const newTime = Math.max(0, Math.min(fileDuration, scratchPosition / audioBuffer.sampleRate + seekDelta));
  scratchPosition = newTime * audioBuffer.sampleRate;
  scratchRate = delta * sensitivity * audioBuffer.sampleRate / 1024;
  lastScrubTime = performance.now();
  audioElement.currentTime = newTime;

  clearTimeout(applyJog._stopTimer);
  applyJog._stopTimer = setTimeout(() => {
    if (!scratchActive) return;
    scratchGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
    scratchActive = false;
    scratchRate = 0;
    if (jogWasPlaying) audioElement.play();
  }, 120);
}

function applyCCValue(paramId, ccVal) {
  const cc = paramToCC[paramId];
  const rel = cc !== undefined && ccRelative[cc];

  if (paramId === 'jog') {
    applyJog(ccVal);
    return;
  }

  if (paramId === 'pitch') {
    const el = document.getElementById('pitch-slider');
    const min = parseFloat(el.min);
    const max = parseFloat(el.max);
    if (rel) {
      const delta = decodeRelative(ccVal);
      const step = (max - min) / 80;
      el.value = Math.max(min, Math.min(max, parseFloat(el.value) + delta * step));
    } else {
      el.value = min + (ccVal / 127) * (max - min);
    }
    changePitch();
  } else {
    const el = document.getElementById('knob-' + paramId);
    if (!el) return;
    const min = parseFloat(el.dataset.min);
    const max = parseFloat(el.dataset.max);
    let val;
    if (rel) {
      const delta = decodeRelative(ccVal);
      const step = (max - min) / 80;
      val = Math.round(Math.max(min, Math.min(max, parseFloat(el.dataset.value) + delta * step)) * 10) / 10;
    } else {
      val = Math.round((min + (ccVal / 127) * (max - min)) * 10) / 10;
    }
    el.dataset.value = val;
    updateKnobVisual(el);
    applyKnobParam(paramId, val);
  }
}

function triggerAction(actionId) {
  if (actionId === 'play') togglePlay();
  else if (actionId === 'cue') goToCue();
  else if (actionId === 'nudge-down') nudgeStart(-1);
  else if (actionId === 'nudge-up') nudgeStart(1);
  else if (actionId === 'cue-out') toggleCueOut();
}

function releaseAction(actionId) {
  if (actionId === 'nudge-down' || actionId === 'nudge-up') nudgeEnd();
  else if (actionId === 'cue') releaseCue();
}

function showMidiPopup(type, id, x, y) {
  closeMidiPopup();
  const el = document.createElement('div');
  el.className = 'midi-popup';
  const isCC = type === 'cc';
  const label = id.toUpperCase();
  const current = isCC ? paramToCC[id] : actionToNote[id];
  const tag = isCC ? 'CC' : 'NOTE';

  const relChecked = isCC && current !== undefined && ccRelative[current] ? ' checked' : '';
  el.innerHTML =
    '<div class="mp-title">' + label + (current !== undefined ? ' — ' + tag + ' ' + current : '') + '</div>' +
    '<div class="mp-row"><span style="color:#888;">' + tag + '#</span>' +
    '<input type="number" min="0" max="127" value="' + (current !== undefined ? current : '') + '" id="mp-num-input" placeholder="0-127">' +
    (isCC ? '<label style="font-size:10px;color:#888;cursor:pointer;margin-left:6px;white-space:nowrap;"><input type="checkbox" id="mp-rel-chk"' + relChecked + ' style="margin-right:3px;">REL</label>' : '') +
    '</div>' +
    '<button class="mp-btn" id="mp-learn-btn">LEARN</button>' +
    '<button class="mp-btn" id="mp-clear-btn">CLEAR</button>';

  el.style.left = Math.min(x, window.innerWidth - 200) + 'px';
  el.style.top = Math.min(y, window.innerHeight - 140) + 'px';
  el.dataset.type = type;
  el.dataset.targetId = id;
  document.body.appendChild(el);
  midiPopupEl = el;

  const numInput = el.querySelector('#mp-num-input');
  numInput.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') {
      const v = parseInt(numInput.value);
      if (v >= 0 && v <= 127) {
        if (isCC) {
          assignCC(v, id);
          const relChk = el.querySelector('#mp-rel-chk');
          if (relChk) ccRelative[v] = relChk.checked;
        } else {
          assignNote(v, id);
        }
        closeMidiPopup(false);
      }
    }
  });
  numInput.focus();

  el.querySelector('#mp-learn-btn').addEventListener('click', (e) => {
    midiLearnTarget = id;
    midiLearnType = type;
    e.target.classList.add('learning');
    e.target.textContent = 'WAITING...';
  });

  el.querySelector('#mp-clear-btn').addEventListener('click', () => {
    isCC ? clearCC(id) : clearNote(id);
    closeMidiPopup(false);
  });

  setTimeout(() => document.addEventListener('pointerdown', closeMidiPopupOutside), 0);
}

function closeMidiPopup(autoAssign) {
  if (midiPopupEl) {
    if (autoAssign !== false) {
      const input = midiPopupEl.querySelector('#mp-num-input');
      const relChk = midiPopupEl.querySelector('#mp-rel-chk');
      const id = midiPopupEl.dataset.targetId;
      const type = midiPopupEl.dataset.type;
      if (input && id) {
        const v = parseInt(input.value);
        if (v >= 0 && v <= 127) {
          if (type === 'cc') {
            assignCC(v, id);
            if (relChk) ccRelative[v] = relChk.checked;
          } else {
            assignNote(v, id);
          }
        }
      }
    }
    midiPopupEl.remove();
    midiPopupEl = null;
  }
  midiLearnTarget = null;
  midiLearnType = null;
  document.removeEventListener('pointerdown', closeMidiPopupOutside);
}

function closeMidiPopupOutside(e) {
  if (!midiPopupEl) return;
  const rect = midiPopupEl.getBoundingClientRect();
  if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) {
    closeMidiPopup();
  }
}

// CC right-click on knobs and pitch slider
document.querySelectorAll('.knob').forEach(el => {
  el.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    showMidiPopup('cc', el.dataset.param, e.clientX, e.clientY);
  });
});
document.getElementById('pitch-slider').addEventListener('contextmenu', (e) => {
  e.preventDefault();
  showMidiPopup('cc', 'pitch', e.clientX, e.clientY);
});
document.getElementById('waveform-canvas').addEventListener('contextmenu', (e) => {
  e.preventDefault();
  showMidiPopup('cc', 'jog', e.clientX, e.clientY);
});

// Note right-click on play and cue buttons
document.getElementById('btn-play').addEventListener('contextmenu', (e) => {
  e.preventDefault();
  showMidiPopup('note', 'play', e.clientX, e.clientY);
});
document.getElementById('btn-cue').addEventListener('contextmenu', (e) => {
  e.preventDefault();
  showMidiPopup('note', 'cue', e.clientX, e.clientY);
});
document.getElementById('btn-nudge-down').addEventListener('contextmenu', (e) => {
  e.preventDefault();
  showMidiPopup('note', 'nudge-down', e.clientX, e.clientY);
});
document.getElementById('btn-nudge-up').addEventListener('contextmenu', (e) => {
  e.preventDefault();
  showMidiPopup('note', 'nudge-up', e.clientX, e.clientY);
});
document.getElementById('cue-toggle').addEventListener('contextmenu', (e) => {
  e.preventDefault();
  showMidiPopup('note', 'cue-out', e.clientX, e.clientY);
});

detectMidi();

// ── MOBILE SCALING ────────────────────────────────
function scaleCrt() {
  const crt = document.getElementById('crt');
  crt.style.transform = '';
  crt.style.transformOrigin = 'top center';
  const pad = 16;
  const crtW = crt.scrollWidth;
  const vpW = window.innerWidth;
  if (crtW + pad * 2 > vpW) {
    const s = (vpW - pad * 2) / crtW;
    crt.style.transform = `scale(${s})`;
  }
}
window.addEventListener('resize', scaleCrt);
requestAnimationFrame(scaleCrt);
